services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: finalmove
      POSTGRES_USER: finalmove
      POSTGRES_DB: finalmove
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalmove"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
