# Production API host: API server, Postgres, Redis and Caddy (TLS) on one machine.
# Run from the repository root:
#   docker compose --env-file .env -f deploy/compose.prod.yaml up -d --build
# Only Caddy publishes ports. Secrets live in .env on the host, never in the repo.
name: final-move

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    restart: unless-stopped
    env_file: ../.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://finalmove:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/finalmove
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 1g
    pids_limit: 512
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finalmove
      POSTGRES_DB: finalmove
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["pgdata:/var/lib/postgresql"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finalmove"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [server]
    mem_limit: 128m

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
